<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">PlaceContext Proxmox homelab</title>
  <desc id="desc">A PlaceContext portal VM connects to CPU and GPU worker VMs over the Proxmox LAN and to a Mac AI shard over Tailscale.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43d675"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="600" height="320" rx="24" fill="#151a1f" stroke="#56616b" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="44" y="40" width="160" height="36" rx="18" fill="#29323a"/>
  <text x="124" y="64" fill="#f4f7f5" font-family="sans-serif" font-size="17" text-anchor="middle">Proxmox host</text>
  <rect x="70" y="128" width="210" height="90" rx="18" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="175" y="165" fill="#43d675" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle">PlaceContext</text>
  <text x="175" y="193" fill="#f4f7f5" font-family="sans-serif" font-size="16" text-anchor="middle">portal VM</text>
  <rect x="385" y="92" width="190" height="76" rx="16" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="480" y="125" fill="#43d675" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">CPU worker VM</text>
  <text x="480" y="149" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">local jobs</text>
  <rect x="385" y="220" width="190" height="76" rx="16" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="480" y="253" fill="#43d675" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">GPU worker VM</text>
  <text x="480" y="277" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">accelerated jobs</text>
  <path d="M 280 158 C 330 158 335 130 382 130" fill="none" stroke="#43d675" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 280 190 C 330 190 335 258 382 258" fill="none" stroke="#43d675" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="286" y="154" width="90" height="30" rx="15" fill="#29323a"/>
  <text x="331" y="175" fill="#f4f7f5" font-family="sans-serif" font-size="13" text-anchor="middle">local k3s</text>
  <rect x="690" y="128" width="180" height="90" rx="18" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="780" y="165" fill="#43d675" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle">Mac AI shard</text>
  <text x="780" y="193" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">another site</text>
  <path d="M 280 205 C 455 338 625 285 688 202" fill="none" stroke="#43d675" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="610" y="260" width="100" height="32" rx="16" fill="#29323a"/>
  <text x="660" y="282" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">Tailscale</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">PlaceContext workers connected across sites with Tailscale</title>
  <desc id="desc">A PlaceContext master and Proxmox worker on the home LAN connect through a Tailscale tailnet to a remote worker and operator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43d675"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="300" height="280" rx="24" fill="#151a1f" stroke="#56616b" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="44" y="58" width="120" height="36" rx="18" fill="#29323a"/>
  <text x="104" y="82" fill="#f4f7f5" font-family="sans-serif" font-size="17" text-anchor="middle">Home LAN</text>
  <rect x="70" y="120" width="200" height="72" rx="16" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="170" y="151" fill="#43d675" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">PlaceContext master</text>
  <text x="170" y="175" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">stable mesh address</text>
  <rect x="70" y="224" width="200" height="64" rx="16" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="170" y="263" fill="#f4f7f5" font-family="sans-serif" font-size="17" text-anchor="middle">Proxmox worker</text>
  <rect x="390" y="130" width="150" height="100" rx="50" fill="#0d1013" stroke="#43d675" stroke-width="4"/>
  <text x="465" y="172" fill="#43d675" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">Tailscale</text>
  <text x="465" y="199" fill="#f4f7f5" font-family="sans-serif" font-size="15" text-anchor="middle">tailnet</text>
  <rect x="630" y="88" width="220" height="72" rx="16" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="740" y="119" fill="#43d675" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Remote worker</text>
  <text x="740" y="143" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">cloud or another site</text>
  <rect x="630" y="220" width="220" height="72" rx="16" fill="#0d1013" stroke="#43d675" stroke-width="3"/>
  <text x="740" y="251" fill="#43d675" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">Remote operator</text>
  <text x="740" y="275" fill="#f4f7f5" font-family="sans-serif" font-size="14" text-anchor="middle">portal and MCP</text>
  <path d="M 270 156 L 387 171" fill="none" stroke="#43d675" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 270 256 L 395 210" fill="none" stroke="#43d675" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 540 165 L 627 132" fill="none" stroke="#43d675" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 540 205 L 627 246" fill="none" stroke="#43d675" stroke-width="3" marker-end="url(#arrow)"/>
</svg>

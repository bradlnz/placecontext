<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Verify · PlaceContext</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">P</div><strong>PlaceContext</strong></div>
    <h1>{{heading}}</h1>
    <p class="alt" style="text-align:left;margin:0 0 16px">
      {{hint}}
      The code expires in 10 minutes.
    </p>
    <div class="err {{errorClass}}">{{error}}</div>
    <form method="post" action="/auth/email-verify">
      <input type="hidden" name="state" value="{{state}}">
      <input type="hidden" name="{{afName}}" value="{{afValue}}">
      <div class="{{phoneClass}}">
        <label>Mobile number
          <input type="tel" name="phone" autocomplete="tel" placeholder="+15551234567" autofocus>
        </label>
      </div>
      <div class="{{codeClass}}">
        <label>Verification code
          <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                 autocomplete="one-time-code" required autofocus placeholder="000000">
        </label>
      </div>
      <button type="submit">Verify and sign in</button>
    </form>
    <form method="post" action="/auth/email-verify/resend" style="margin-top:12px" class="{{codeClass}}">
      <input type="hidden" name="state" value="{{state}}">
      <input type="hidden" name="{{afName}}" value="{{afValue}}">
      <button type="submit" style="background:#262a31">Send another code</button>
    </form>
    <p class="alt {{switchClass}}" style="margin-top:12px"><a href="{{switchHref}}">{{switchLabel}}</a></p>
  </div>
</body>
</html>

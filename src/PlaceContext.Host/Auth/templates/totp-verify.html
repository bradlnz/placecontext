<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify · PlaceContext</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">P</div><strong>PlaceContext</strong></div>
    <h1>Two-factor verification</h1>
    <p class="alt" style="text-align:left;margin:0 0 16px">Enter the 6-digit code from your authenticator app.</p>
    <div class="err {{errorClass}}">{{error}}</div>
    <form method="post" action="/auth/totp-verify">
      <input type="hidden" name="state" value="{{state}}">
      <input type="hidden" name="{{afName}}" value="{{afValue}}">
      <label>Code
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               autocomplete="one-time-code" required autofocus placeholder="000000">
      </label>
      <button type="submit">Verify</button>
    </form>
    <form method="post" action="/auth/totp-verify" style="margin-top:12px">
      <input type="hidden" name="state" value="{{state}}">
      <input type="hidden" name="{{afName}}" value="{{afValue}}">
      <input type="hidden" name="useRecovery" value="1">
      <label>Recovery code
        <input type="text" name="code" autocomplete="off" placeholder="XXXXXXXX">
      </label>
      <button type="submit" style="background:#262a31">Use a recovery code</button>
    </form>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · PlaceContext</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <form class="card" method="post" action="/auth/login">
    <div class="brand"><div class="logo">P</div><strong>PlaceContext</strong></div>
    <h1>Sign in to PlaceContext</h1>
    <div class="err {{errorClass}}">{{error}}</div>
    <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="{{afName}}" value="{{afValue}}">
    <input type="hidden" name="returnUrl" value="{{returnUrl}}">
    <button type="submit">Sign in</button>
    <p class="alt">New here? <a href="/register{{returnUrlHref}}">Create an account</a></p>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join · PlaceContext</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <form class="card" method="post" action="/auth/accept-invite">
    <div class="brand"><div class="logo">P</div><strong>PlaceContext</strong></div>
    <h1>Join as {{role}}</h1>
    <div class="err {{errorClass}}">{{error}}</div>
    <p class="alt" style="text-align:left;margin:0 0 14px">You were invited as <strong>{{email}}</strong>.</p>
    <label>Display name<input type="text" name="displayName" autocomplete="name"></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" required autofocus>
      <span class="hint">At least 12 characters.</span></label>
    <input type="hidden" name="token" value="{{token}}">
    <input type="hidden" name="{{afName}}" value="{{afValue}}">
    <button type="submit">Create account</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · PlaceContext</title>
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <form class="card" method="post" action="/auth/register">
    <div class="brand"><div class="logo">P</div><strong>PlaceContext</strong></div>
    <h1>Create your PlaceContext account</h1>
    <div class="err {{errorClass}}">{{error}}</div>
    <label>Display name<input type="text" name="displayName" autocomplete="name"></label>
    <label>Email<input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required>
      <span class="hint">At least 8 characters.</span></label>
    <input type="hidden" name="{{afName}}" value="{{afValue}}">
    <button type="submit">Create account</button>
    <p class="alt">Already have an account? <a href="/login">Sign in</a></p>
  </form>
</body>
</html>

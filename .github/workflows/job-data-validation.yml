name: Validate job and workflow changes

on:
  push:
    branches:
      - codex/saas-run-plans-managed-oauth
  pull_request:
    branches:
      - main
      - codex/workflow-first-architecture
      - codex/job-data-saas-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-workflows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  job-data:
    name: .NET build and data-contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: placecontext_ci
          POSTGRES_PASSWORD: placecontext_ci
          POSTGRES_DB: placecontext_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U placecontext_ci -d placecontext_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLACECONTEXT_TEST_POSTGRES: "Host=localhost;Port=5432;Database=placecontext_ci;Username=placecontext_ci;Password=placecontext_ci"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure .NET SDK from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore and build solution
        run: |
          dotnet restore PlaceContext.slnx
          dotnet build PlaceContext.slnx --configuration Release --no-restore

      - name: Run workflow and edit-conflict tests
        run: |
          dotnet test tests/PlaceContext.Application.Tests/PlaceContext.Application.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~WorkflowReadinessTests|FullyQualifiedName~Updating_a_workflow_rejects_stale_editor_revisions|FullyQualifiedName~Workflow_domain_keeps_its_loaded_revision_across_mutations"

      - name: Run job template and editor contracts
        run: |
          dotnet test tests/PlaceContext.Host.Tests/PlaceContext.Host.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~JobTemplateCatalogTests|FullyQualifiedName~DataWorkflowSaasFoundationTests|FullyQualifiedName~WorkflowConditionalPathTests|FullyQualifiedName~ManagedWorkflowQueueContractTests|FullyQualifiedName~RpcChainIngestionContractTests"

      - name: Validate SaaS allowance, signed billing and OAuth
        run: |
          dotnet test tests/PlaceContext.Infrastructure.Tests/PlaceContext.Infrastructure.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~StripeBillingSecurityTests|FullyQualifiedName~ManagedOAuthProtocolTests|FullyQualifiedName~RunAllowancePostgresTests|FullyQualifiedName~ChainQueueTests"
          dotnet test tests/PlaceContext.Host.Tests/PlaceContext.Host.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~JobTemplateCatalogTests"

      - name: Run exact data-quality job source tests
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/deploy/test_data_quality_template.py

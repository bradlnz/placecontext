name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: .NET build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --nologo -v q
      - run: dotnet test --nologo -v q --no-build

  tui:
    name: TUI build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/tui/go.mod
      - run: go build ./...
        working-directory: deploy/tui
      - run: go vet ./...
        working-directory: deploy/tui
      - run: go test ./...
        working-directory: deploy/tui

  pctl:
    name: pctl syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash -n deploy/pctl
          bash -n deploy/install.sh

name: Build deploy release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build runtime and local installer
    runs-on: [self-hosted, Linux, X64, placecontext]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the shard coordinator
        run: dotnet test tests/PlaceContext.ClusterHost.Tests/PlaceContext.ClusterHost.Tests.csproj --configuration Release

      - name: Resolve runtime image
        id: runtime-meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="sha-${GITHUB_SHA:0:12}"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image-ref=$image:$tag" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish PlaceContext runtime
        id: runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.runtime-meta.outputs.image-ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Validate release contents
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/release/install.sh
          python3 -c "compile(open('deploy/release/local-ai/worker.py', encoding='utf-8').read(), 'worker.py', 'exec')"
          test -d deploy/release/k3s
          test -f deploy/release/k3s/placecontext.yaml
          test -x deploy/release/install.sh
          test -f deploy/release/local-ai/config.yaml
          test -f deploy/release/local-ai/runtime.yaml
          test -f deploy/release/local-ai/worker.py

      - name: Build release archives
        env:
          RUNTIME_IMAGE: ${{ steps.runtime-meta.outputs.image }}@${{ steps.runtime.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"
          bundle_root="$RUNNER_TEMP/placecontext-deploy"

          mkdir -p "$bundle_root" dist
          cp -R deploy/release/. "$bundle_root/"
          cp LICENSE "$bundle_root/LICENSE"
          chmod 0755 "$bundle_root/install.sh"
          printf '%s\n' "$version" > "$bundle_root/VERSION"
          sed -i "s|__PLACECONTEXT_RUNTIME_IMAGE__|$RUNTIME_IMAGE|g" \
            "$bundle_root/local-ai/config.yaml" \
            "$bundle_root/local-ai/runtime.yaml"

          if rg -n '__PLACECONTEXT_RUNTIME_IMAGE__' "$bundle_root"; then
            echo "Runtime image placeholder was not resolved" >&2
            exit 1
          fi

          tar -C "$RUNNER_TEMP" -czf "dist/placecontext-deploy.tar.gz" placecontext-deploy
          cp "dist/placecontext-deploy.tar.gz" "dist/placecontext-deploy-${version}.tar.gz"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/dist/placecontext-deploy-${version}.zip" placecontext-deploy)
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: placecontext-deploy-${{ github.run_number }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --generate-notes \
              --title "PlaceContext deploy $GITHUB_REF_NAME"
          fi

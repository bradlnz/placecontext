name: Build and publish release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deploy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build compiled bundles and publish release
    runs-on: [self-hosted, Linux, X64, placecontext]
    timeout-minutes: 90

    steps:
      - name: Check out private source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the release contract
        run: dotnet test tests/PlaceContext.Host.Tests/PlaceContext.Host.Tests.csproj --configuration Release --filter FullyQualifiedName~ReleaseInstallerContractTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/release/install.sh
          bash -n deploy/release/install-production.sh
          bash -n deploy/release/package.sh
          python3 -c "compile(open('deploy/release/local-ai/worker.py', encoding='utf-8').read(), 'worker.py', 'exec')"

      - name: Build source-free release bundles
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA:0:12}"
          fi
          deploy/release/package.sh --version "$version" --arch amd64
          deploy/release/package.sh --version "$version" --arch arm64
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        id: release

      - name: Publish multi-architecture production image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Record immutable production image
        shell: bash
        run: |
          printf '%s@%s\n' '${{ steps.release.outputs.image }}' '${{ steps.image.outputs.digest }}' \
            > "dist/upload/releases/${{ steps.release.outputs.version }}/PRODUCTION_IMAGE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: placecontext-release-${{ github.run_number }}
          path: dist/upload
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/upload/install.sh \
            dist/upload/join.sh \
            "dist/upload/releases/${{ steps.release.outputs.version }}"/* \
            --generate-notes \
            --verify-tag

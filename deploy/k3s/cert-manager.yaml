# cert-manager issuer for the internal cluster.
# Uses a self-signed root CA stored in the placecontext-ca secret.
#
# SETUP (one-time):
#   1. Generate CA certs:
#      openssl genrsa -out root_ca_key 4096
#      openssl req -new -x509 -key root_ca_key -out root_ca.crt -days 3650 \
#        -subj "/CN=Tailscale Internal CA" \
#        -addext "basicConstraints=critical,CA:TRUE" \
#        -addext "keyUsage=critical,keyCertSign,cRLSign"
#   2. Create the secret:
#      kubectl create secret tls placecontext-ca --cert=root_ca.crt --key=root_ca_key -n cert-manager
#   3. Apply this file to create the ClusterIssuer.
#
# CLIENT TRUST:
#   Distribute root_ca.crt to users and install it:
#     Ubuntu/Debian:  sudo cp root_ca.crt /usr/local/share/ca-certificates/tailscale-internal-ca.crt && sudo update-ca-certificates
#     macOS:          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain root_ca.crt
#     Windows:        certutil -addstore -f "Root" root_ca.crt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: placecontext-ca
---
# Let's Encrypt issuer for public-facing domains.
# Requires port 80 open for HTTP-01 challenge.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: brad.lietz@outlook.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: traefik

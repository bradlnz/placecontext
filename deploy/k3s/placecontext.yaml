# PlaceContext Host deployment — portal + MCP + trigger scheduler.
# __IMAGE__ is substituted by the `pctl` CLI with the container image ref.
# The deployment uses the `placecontext` namespace for all namespaced resources.
# (Subscriptions/billing are handled by a separate web portal — no activation key here.)
#
# The scheduler is safe to scale: a Postgres advisory lock elects one replica to scan schedules, and the
# durable run queue (pending_job_runs) is drained with FOR UPDATE SKIP LOCKED so any replica can execute
# runs without duplication. Bump replicas freely.
# ServiceAccount + RBAC so the Host can run jobs as Kubernetes Jobs in its namespace
# (create/watch Jobs, read their pods + logs, manage the per-run ConfigMap + deny-egress NetworkPolicy).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: placecontext
  namespace: placecontext
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: placecontext-jobs
  namespace: placecontext
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkingpolicies"]
    verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: placecontext-jobs
  namespace: placecontext
subjects:
  - kind: ServiceAccount
    name: placecontext
    namespace: placecontext
roleRef:
  kind: Role
  name: placecontext-jobs
  apiGroup: rbac.authorization.k8s.io
---
# Cluster page: node inventory (KubernetesClusterInfoProvider lists nodes for the fleet view).
# `nodes` is a cluster-scoped resource — a namespaced Role can't grant it, so this needs a
# ClusterRole/ClusterRoleBinding even though every other Host permission stays namespace-scoped.
# The provider also best-effort reads its own pod (to mark "this node") which the namespaced
# placecontext-jobs Role above already covers via pods:get.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: placecontext-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    # patch/update: designate fleet master annotation from the Cluster page
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: placecontext-nodes
subjects:
  - kind: ServiceAccount
    name: placecontext
    namespace: placecontext
roleRef:
  kind: ClusterRole
  name: placecontext-nodes
  apiGroup: rbac.authorization.k8s.io
---
# Cluster page: ConfigMap placecontext-cluster (designated master) + Secret placecontext-cluster-join
# (k3s node-token for portal join codes). Namespaced — not cluster-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: placecontext-cluster-admin
  namespace: placecontext
rules:
  # Designated master ConfigMap (create-or-replace). Scoped to this namespace only.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Join token for portal-minted PC2 join codes (seeded by installer on the k3s server).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["placecontext-cluster-join"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: placecontext-cluster-admin
  namespace: placecontext
subjects:
  - kind: ServiceAccount
    name: placecontext
    namespace: placecontext
roleRef:
  kind: Role
  name: placecontext-cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placecontext
  namespace: placecontext
spec:
  replicas: 1
  selector:
    matchLabels: { app: placecontext }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels: { app: placecontext }
    spec:
      serviceAccountName: placecontext
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Wait for PostgreSQL to accept connections before starting the Host, so the
      # first boot doesn't crash-loop while the DB is still coming up / migrating.
      initContainers:
        - name: wait-for-db
          image: pgvector/pgvector:pg16
          command:
            - sh
            - -c
            - |
              until pg_isready -h placecontext-db -p 5432 -U postgres -d placecontext; do
                echo "waiting for placecontext-db…"; sleep 2
              done
      containers:
        - name: host
          image: __IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          resources:
            requests:
              cpu: "150m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          ports:
            - containerPort: 7700
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:7700"
            # Connection string is built by pctl into placecontext-db (password never committed).
            - name: PlaceContext__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: placecontext-db
                  key: connection-string
            # HMAC key the pctl TUI uses to mint short-lived portal sign-in tokens (see deploy/pctl).
            - name: PlaceContext__Portal__SigningKey
              valueFrom:
                secretKeyRef:
                  name: placecontext-portal
                  key: signing-key
            # Shared RSA key for signing OAuth/MCP access tokens, so every replica verifies the same kid.
            - name: PlaceContext__OAuth__SigningKeyPem
              valueFrom:
                secretKeyRef:
                  name: placecontext-oauth
                  key: key.pem
            # Operator-controlled remote OAuth client. Dynamic registration remains loopback-only.
            - name: PlaceContext__OAuth__TrustedClients__AdminPortal__ClientId
              value: "ossen-reports-admin"
            - name: PlaceContext__OAuth__TrustedClients__AdminPortal__RedirectUri
              value: "https://reports.ossenpropertygroup.com.au/auth/placecontext/callback"
            - name: PlaceContext__OAuth__TrustedClients__AdminPortal__Name
              value: "Reports admin"
            # Encrypts the Data Protection key ring at rest (vault secrets + auth cookies).
            - name: PlaceContext__DataProtection__Key
              valueFrom:
                secretKeyRef:
                  name: placecontext-dp
                  key: key
            # No in-cluster LLM: the jobs pipeline is fully deterministic.
            - name: PlaceContext__Llm__Provider
              value: "none"
            # Object store (DigitalOcean Spaces) for post-job artifacts.
            - name: PlaceContext__ObjectStore__Endpoint
              value: "https://syd1.digitaloceanspaces.com"
            - name: PlaceContext__ObjectStore__AccessKey
              valueFrom:
                secretKeyRef:
                  name: placecontext-do-spaces
                  key: ACCESS_KEY_ID
            - name: PlaceContext__ObjectStore__SecretKey
              valueFrom:
                secretKeyRef:
                  name: placecontext-do-spaces
                  key: ACCESS_KEY_SECRET
            - name: PlaceContext__ObjectStore__Region
              value: "syd1"
            - name: PlaceContext__ObjectStore__ForcePathStyle
              value: "false"
            - name: PlaceContext__ObjectStore__ReportsBucket
              value: "ossenfeasibility"
            - name: PlaceContext__ObjectStore__DepsBucket
              value: "ossenfeasibility"
            # Redis cache for job_runs ShardResultsJson (keeps Postgres lean).
            - name: PlaceContext__Redis__ConnectionString
              value: "redis:6379,abortConnect=false,connectRetry=5,keepAlive=60,syncTimeout=10000,connectTimeout=5000,responseTimeout=10000,"
            # Qdrant vector DB (for future RAG enhancements)
            - name: PlaceContext__Qdrant__Endpoint
              value: "http://qdrant:6333"
            - name: PlaceContext__Qdrant__Collection
              value: "placecontext"
            # Internal CA cert for the /ca endpoint (client trust installation).
            - name: PLACECONTEXT_CA_CERT_PATH
              value: "/etc/placecontext/ca/tls.crt"
            - name: PLACECONTEXT_HOSTNAME
              value: "feasibility.ossenpropertygroup.com.au"
            # Pin the public origin so OAuth metadata and MCP Www-Authenticate headers use https://
            # even when Traefik forwards X-Forwarded-Proto is not propagated to the app.
            - name: PlaceContext__PublicBaseUrl
              value: "https://feasibility.ossenpropertygroup.com.au"
            # Job placement: job pods always *prefer* worker (agent) nodes, so a cloud portal
            # server stays responsive while execution happens on the machines you joined over
            # Tailscale. Set "true" to *require* workers — jobs then never run on the control
            # plane and queue until a worker is online (pctl jobs placement require|prefer).
            - name: PlaceContext__WorkloadRunner__RequireWorkerNodes
              value: "false"
            # Cluster proxy runs as a sidecar on localhost:8081 — the Host probes this for health.
            - name: PlaceContext__ClusterChat__Endpoint
              value: "http://localhost:8081/api/cluster"
            - name: PlaceContext__ClusterChat__Model
              value: "qwen3.5-4b"
            - name: PlaceContext__ClusterChat__ShardEndpoints__0
              value: "http://100.83.58.75:8080"
            # Voyage AI embeddings (fast). Takes precedence over cluster mean-pool embeddings
            # whenever PlaceContext__Voyage__ApiKey is set (see DependencyInjection). Dimensions
            # must match voyage-3 (1024) — pgvector tables self-init to this size on first use.
            - name: PlaceContext__Voyage__ApiKey
              valueFrom:
                secretKeyRef:
                  name: placecontext-voyage
                  key: api-key
            - name: PlaceContext__Voyage__Model
              value: "voyage-3"
            - name: PlaceContext__Voyage__Dimensions
              value: "1024"
            # Kept for reference if Voyage is unset and cluster embeddings are used instead.
            - name: PlaceContext__ClusterChat__EmbeddingDimensions
              value: "2560"
            # Slack Events API → agent (optional). Create secret placecontext-slack with
            # signing-secret, bot-token, project-id to enable POST /slack/events.
            - name: PlaceContext__Slack__SigningSecret
              valueFrom:
                secretKeyRef:
                  name: placecontext-slack
                  key: signing-secret
                  optional: true
            - name: PlaceContext__Slack__BotToken
              valueFrom:
                secretKeyRef:
                  name: placecontext-slack
                  key: bot-token
                  optional: true
            - name: PlaceContext__Slack__ProjectId
              valueFrom:
                secretKeyRef:
                  name: placecontext-slack
                  key: project-id
                  optional: true
          startupProbe:
            httpGet: { path: /healthz, port: 7700 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 7700 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 7700 }
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/placecontext/ca
              readOnly: true

        # Cluster proxy sidecar — handles shard server health checks and proxies chat requests.
        # Runs independently of the Host so the portal can start without the cluster being available.
        - name: cluster
          image: __IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8081
          env:
            - name: CLUSTER
              value: "1"
            - name: ASPNETCORE_URLS
              value: "http://+:8081"
            - name: PlaceContext__ClusterChat__Model
              value: "qwen3.5-4b"
            - name: PlaceContext__ClusterChat__ShardEndpoints__0
              value: "http://100.83.58.75:8080"
          startupProbe:
            httpGet: { path: /api/cluster/health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /api/cluster/health, port: 8081 }
            periodSeconds: 10
      volumes:
        - name: ca-cert
          secret:
            secretName: placecontext-ca
---
apiVersion: v1
kind: Service
metadata:
  name: placecontext
  namespace: placecontext
  annotations:
    # Sticky sessions: Blazor Server interactive circuits (SignalR over WebSocket/long-poll) are stateful
    # and pinned to one pod; without affinity a reconnect hits another replica → "No Connection with that
    # ID: 404" and the interactive UI (e.g. clickable cards) breaks. Traefik pins each client by cookie.
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "placecontext_affinity"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
spec:
  selector: { app: placecontext }
  ports:
    - port: 80
      targetPort: 7700
---
# Vector DB for future advanced RAG (optional — content index uses pgvector today)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: placecontext
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: placecontext
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-storage
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.1
          ports:
            - containerPort: 6333  # REST API
            - containerPort: 6334  # gRPC
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /readyz, port: 6333 }
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: placecontext
spec:
  selector: { app: qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
# k3s ships Traefik — expose the portal/MCP via an Ingress with TLS (internal CA).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placecontext
  namespace: placecontext
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - feasibility.ossenpropertygroup.com.au
    secretName: feasibility-tls
  rules:
  - host: feasibility.ossenpropertygroup.com.au
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: placecontext
            port:
              number: 80

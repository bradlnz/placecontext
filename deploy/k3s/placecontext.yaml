# PlaceContext Host deployment — portal + MCP + trigger scheduler.
# __IMAGE__ is substituted by deploy/selfhost.sh with the published image ref.
# The activation key comes from the placecontext-activation secret (created by the installer).
#
# The scheduler is safe to scale: a Postgres advisory lock elects one replica to scan schedules, and the
# durable run queue (pending_job_runs) is drained with FOR UPDATE SKIP LOCKED so any replica can execute
# runs without duplication. Bump replicas freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placecontext
spec:
  replicas: 2
  selector:
    matchLabels: { app: placecontext }
  template:
    metadata:
      labels: { app: placecontext }
    spec:
      containers:
        - name: host
          image: __IMAGE__
          ports:
            - containerPort: 7700
          env:
            - name: PlaceContext__ConnectionString
              value: "Host=placecontext-db;Port=5432;Database=placecontext;Username=postgres;Password=postgres"
            - name: PlaceContext__Activation__Enforce
              value: "true"
            - name: PlaceContext__Activation__Key
              valueFrom:
                secretKeyRef:
                  name: placecontext-activation
                  key: key
          readinessProbe:
            httpGet: { path: /, port: 7700 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: placecontext
spec:
  selector: { app: placecontext }
  ports:
    - port: 80
      targetPort: 7700
---
# k3s ships Traefik — expose the portal/MCP via an Ingress. Set your host as needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: placecontext
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: placecontext
                port:
                  number: 80

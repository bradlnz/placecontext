# Per-tenant Rails customer portal template.
# Replace __TENANT__, __TENANT_ID__, __PORTAL_DOMAIN__, and __IMAGE__ before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: customer-portal-__TENANT__
  labels:
    placecontext.ai/tenant: __TENANT__
    placecontext.ai/surface: customer-portal
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-portal
  namespace: customer-portal-__TENANT__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: customer-portal-__TENANT__
spec:
  replicas: 2
  selector:
    matchLabels: { app: customer-portal }
  template:
    metadata:
      labels: { app: customer-portal }
    spec:
      serviceAccountName: customer-portal
      containers:
        - name: customer-portal
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 7701 }]
          env:
            - name: RAILS_ENV
              value: production
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: PORT
              value: "7701"
            - name: PLACE_CONTEXT_TENANT_ID
              value: __TENANT_ID__
            - name: PLACE_CONTEXT_TENANT_SLUG
              value: __TENANT__
            - name: PLACE_CONTEXT_PORTAL_DOMAIN
              value: __PORTAL_DOMAIN__
            - name: PLACE_CONTEXT_PORTAL_SHARED_HOST
              value: portal.placecontext.ai
            - name: PLACE_CONTEXT_PORTAL_PATH
              value: /p/__TENANT__
            - name: RAILS_RELATIVE_URL_ROOT
              value: /p/__TENANT__
            - name: PLACE_CONTEXT_CORE_API_URL
              value: https://placecontext.internal
            - name: PLACE_CONTEXT_CORE_API_KEY
              valueFrom:
                secretKeyRef: { name: customer-portal-secrets, key: core-api-key }
            - name: PLACE_CONTEXT_PROVISIONING_KEY
              valueFrom:
                secretKeyRef: { name: customer-portal-secrets, key: provisioning-key }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: customer-portal-db, key: connection-string }
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef: { name: customer-portal-secrets, key: secret-key-base }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: customer-portal-__TENANT__
spec:
  selector: { app: customer-portal }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: customer-portal
  namespace: customer-portal-__TENANT__
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [__PORTAL_DOMAIN__, portal.placecontext.ai]
      secretName: customer-portal-tls
  rules:
    - host: __PORTAL_DOMAIN__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: customer-portal, port: { name: http } }
    - host: portal.placecontext.ai
      http:
        paths:
          - path: /p/__TENANT__
            pathType: Prefix
            backend:
              service: { name: customer-portal, port: { name: http } }

# Replicated, self-healing PostgreSQL (pgvector) via CloudNativePG — 1 primary + 2 hot-standby
# replicas with streaming replication and automatic failover, spread across nodes by anti-affinity,
# with continuous backup + point-in-time recovery to an object store (MinIO in dev; S3 in prod).
#
# Apps connect to:
#   • placecontext-pg-rw  → the current primary (reads + writes)
#   • placecontext-pg-ro  → replicas only (read-only scale-out)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: placecontext-pg
spec:
  instances: 3
  imageName: ghcr.io/bradlnz/placecontext-pg:16-pgvector
  imagePullPolicy: IfNotPresent
  primaryUpdateStrategy: unsupervised

  # Keep the existing app credentials working (postgres/postgres) by pinning the superuser secret.
  enableSuperuserAccess: true
  superuserSecret:
    name: placecontext-pg-superuser

  postgresql:
    parameters:
      max_connections: "200"

  bootstrap:
    initdb:
      database: placecontext
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  # Continuous backup → object store: base backups + WAL archiving give point-in-time recovery.
  # endpointURL points at the in-cluster MinIO (deploy/k3s/minio.yaml); swap for real S3 in prod.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://placecontext-backups/
      endpointURL: http://minio:9000
      s3Credentials:
        accessKeyId:
          name: placecontext-minio
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: placecontext-minio
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  # Spread the 3 instances across different nodes for real HA.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  storage:
    size: 2Gi
---
# Daily base backup at 03:00; WAL is archived continuously between base backups for PITR.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: placecontext-pg-daily
spec:
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: placecontext-pg

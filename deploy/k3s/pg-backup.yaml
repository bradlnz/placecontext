# Nightly logical dumps of the PostgreSQL databases → MinIO, with retention.
#
# This deliberately replaces the old continuous-backup pipeline (CNPG WAL archiving + PITR), which
# archived every write forever into the in-cluster MinIO and filled the host disk. A gzipped
# `pg_dumpall` once a day, pruned after RETENTION_DAYS, is bounded: worst case ≈ RETENTION_DAYS
# compressed dumps. The trade-off: restores go to the nightly snapshot, not to an arbitrary instant.
#
# Works against either database deployment:
#   • placecontext-pg-rw  (CloudNativePG HA cluster, `pctl db ha`)   — preferred when present
#   • placecontext-db     (single-node postgres.yaml)                — fallback
#
# Driven by pctl:  db backup-now (run once now) · db backups (list) · db restore [--dump KEY]
apiVersion: batch/v1
kind: CronJob
metadata:
  name: placecontext-pg-dump
spec:
  schedule: "0 3 * * *"          # daily 03:00 (cluster TZ, typically UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            # 1) dump all databases (+ roles) to a shared emptyDir
            - name: dump
              image: pgvector/pgvector:pg16
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  # Dump from the read-only replica when HA is enabled so the primary
                  # never takes dump-related locks. Fall back to the primary, then the
                  # single-node postgres service.
                  if pg_isready -h placecontext-pg-ro -U postgres >/dev/null 2>&1; then
                    HOST=placecontext-pg-ro
                  elif pg_isready -h placecontext-pg-rw -U postgres >/dev/null 2>&1; then
                    HOST=placecontext-pg-rw
                  else
                    HOST=placecontext-db
                  fi
                  STAMP="$(date -u +%Y%m%d-%H%M%S)"
                  echo "dumping all databases from ${HOST}…"
                  # Set a session lock timeout so the dump fails fast instead of queuing
                  # behind long-running DDL/transactions.
                  export PGOPTIONS="-c lock_timeout=30s"
                  pg_dumpall -h "$HOST" -U postgres --clean --if-exists | gzip > "/work/pg-${STAMP}.sql.gz"
                  ls -lh /work
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: placecontext-db
                      key: password
              volumeMounts: [{ name: work, mountPath: /work }]
          containers:
            # 2) upload to MinIO and prune — the prune is the disk-safety guardrail
            - name: upload
              image: minio/mc:RELEASE.2024-09-16T17-43-14Z
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  until mc alias set m http://minio:9000 "$AKID" "$ASK" >/dev/null 2>&1; do
                    echo waiting for minio; sleep 3
                  done
                  mc mb --ignore-existing m/placecontext-backups
                  mc cp /work/*.sql.gz m/placecontext-backups/
                  mc rm --recursive --force --older-than "${RETENTION_DAYS}d" m/placecontext-backups/ || true
                  echo "current dumps:"; mc ls m/placecontext-backups/
              env:
                - { name: RETENTION_DAYS, value: "7" }
                - { name: AKID, valueFrom: { secretKeyRef: { name: placecontext-minio, key: ACCESS_KEY_ID } } }
                - { name: ASK,  valueFrom: { secretKeyRef: { name: placecontext-minio, key: ACCESS_SECRET_KEY } } }
              volumeMounts: [{ name: work, mountPath: /work }]
          volumes:
            - { name: work, emptyDir: {} }

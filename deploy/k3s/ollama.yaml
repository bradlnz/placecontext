# Ollama + Gemma — in-cluster local LLM for post-job data organization and report polishing.
# The Host's OllamaLlmGateway (PlaceContext:Llm:Provider=ollama) calls this service's /api/generate to
# turn raw job-run output into clean structured summaries, without sending data to a third-party API.
#
# The model is pulled once on first boot and persisted on a PVC, so restarts skip the download. The pod
# only reports Ready after the model is present (readiness exec probe), so callers never hit a cold model.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 12Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  # Model lives on a ReadWriteOnce PVC → one writer. Recreate (not rolling) avoids two pods fighting
  # over the same volume during a redeploy.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          # Start the server, wait until it answers, pull the model (idempotent — skipped once it's on the
          # PVC), then hand the foreground back to the server process.
          command: ["/bin/sh", "-c"]
          args:
            - |
              /bin/ollama serve &
              spid=$!
              echo "waiting for ollama to accept connections…"
              until /bin/ollama ls >/dev/null 2>&1; do sleep 1; done
              echo "ensuring models ${OLLAMA_MODEL} + ${OLLAMA_EMBED_MODEL} are present…"
              /bin/ollama pull "${OLLAMA_MODEL}" || echo "pull failed; Ollama will fetch on first request"
              /bin/ollama pull "${OLLAMA_EMBED_MODEL}" || echo "embed pull failed; Ollama will fetch on first request"
              wait $spid
          env:
            - name: OLLAMA_MODEL
              value: "gemma3:4b"
            - name: OLLAMA_EMBED_MODEL
              value: "nomic-embed-text"
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "4", memory: "8Gi" }
          # serve binds the port within a second or two → startup passes fast and protects liveness while
          # the (potentially slow) model pull runs.
          startupProbe:
            tcpSocket: { port: 11434 }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: 11434 }
            periodSeconds: 20
            failureThreshold: 5
          # Only Ready once the model is actually pulled, so the Host never routes a generate to a cold
          # model. failureThreshold × periodSeconds (~10 min) covers the first download.
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "ollama ls | grep -q gemma3"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434

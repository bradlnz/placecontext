# Rails customer portal, served under /p/ on the shared admin host
# (feasibility.ossenpropertygroup.com.au) alongside the operator portal.
# Single-tenant deployment in the placecontext namespace; the /p/ path rule is
# added to the main "placecontext" ingress, not declared here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: placecontext
spec:
  replicas: 2
  selector:
    matchLabels: { app: customer-portal }
  template:
    metadata:
      labels: { app: customer-portal }
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: customer-portal
          image: registry.digitalocean.com/ctrlsignalregistryimg/placecontext-customer-portal:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 7701 }]
          env:
            - name: RAILS_ENV
              value: production
            - name: RAILS_FORCE_SSL
              value: "false"
            - name: PORT
              value: "7701"
            - name: PLACE_CONTEXT_TENANT_ID
              value: ef445066-322f-42b8-9801-b7e0b44f5e95
            - name: PLACE_CONTEXT_TENANT_SLUG
              value: default
            - name: PLACE_CONTEXT_PORTAL_DOMAIN
              value: feasibility.ossenpropertygroup.com.au
            - name: PLACE_CONTEXT_PORTAL_SHARED_HOST
              value: feasibility.ossenpropertygroup.com.au
            - name: PLACE_CONTEXT_PORTAL_PATH
              value: /p
            - name: RAILS_RELATIVE_URL_ROOT
              value: /p
            - name: PORTAL_BRAND_NAME
              value: ""
            - name: PORTAL_BRAND_LOGO_URL
              value: ""
            - name: PLACE_CONTEXT_CRM_API_URL
              value: http://placecontext.placecontext.svc.cluster.local
            - name: PLACE_CONTEXT_CUSTOMER_PORTAL_API_KEY
              valueFrom:
                secretKeyRef: { name: customer-portal-secrets, key: core-api-key }
            - name: PLACE_CONTEXT_PROVISIONING_KEY
              valueFrom:
                secretKeyRef: { name: customer-portal-secrets, key: provisioning-key }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: customer-portal-db, key: connection-string }
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef: { name: customer-portal-secrets, key: secret-key-base }
            - name: SMTP_ADDRESS
              value: smtp.postmarkapp.com
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_DOMAIN
              value: placecontext.ai
            - name: SMTP_AUTHENTICATION
              value: plain
            - name: SMTP_ENABLE_STARTTLS
              value: "true"
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef: { name: customer-portal-smtp, key: smtp-username }
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef: { name: customer-portal-smtp, key: smtp-password }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: placecontext
spec:
  selector: { app: customer-portal }
  ports: [{ name: http, port: 80, targetPort: http }]

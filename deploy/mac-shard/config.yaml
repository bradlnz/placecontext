# Shard cluster topology — pipeline parallelism over TCP.
# Each node runs a shard server (deploy/mac-shard/server.py) with a layer slice.
# The K8s proxy chains hidden states through shards in order.
#
# Model: Qwen3.5-4B (~8 GB fp16 SafeTensors, 36 layers).
# Example 2-shard split:
#   Shard 0 (Mac Mini): layers 0-17 + embedding
#   Shard 1 (Mac Pro):  layers 18-35 + LM head

model: "Qwen/Qwen3.5-4B"
total_layers: 36

shard_servers:
  - ip: "100.83.58.75"
    port: 8080
    name: "jarvis-mac-mini"
    platform: "macos-arm64"
    layers: "0-17"

  - ip: "100.x.x.x"
    port: 8080
    name: "second-mac"
    platform: "macos-arm64"
    layers: "18-35"

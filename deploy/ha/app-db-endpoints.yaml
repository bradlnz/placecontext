# How the k3s app pods reach the cross-site HA database.
#
# The DB nodes live on the tailnet (MagicDNS names placecontext-db-primary / placecontext-db-local),
# which in-cluster CoreDNS does NOT resolve. Rather than teach CoreDNS about MagicDNS, we publish each
# DB node as a headless Service backed by a manual Endpoints object pointing at that node's TAILNET IP.
# The app then uses a multi-host Npgsql connection string over these two Service names, and
# `Target Session Attributes=primary` makes Npgsql connect to whichever one is the current leader — so
# a failover (local standby auto-promoted when DO is down) needs NO app change.
#
# FILL IN the two tailnet IPs below (from `tailscale ip -4` on each node — the DO primary and this
# local node), then:  kubectl -n placecontext apply -f deploy/ha/app-db-endpoints.yaml
# Tailnet IPs are stable per node in Headscale; if you rebuild a node, update its Endpoints IP here.
#
# Then set the app connection string (password from: terraform -chdir=deploy/terraform-app output -raw superuser_password):
#   kubectl -n placecontext set env deploy/placecontext \
#     'PlaceContext__ConnectionString=Host=placecontext-db-primary,placecontext-db-local;Port=5432;Database=placecontext;Username=postgres;Password=REDACTED;Target Session Attributes=primary;Load Balance Hosts=false'
---
apiVersion: v1
kind: Service
metadata:
  name: placecontext-db-primary
spec:
  clusterIP: None # headless — the Endpoints IP is used directly
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: placecontext-db-primary # name MUST match the Service above
subsets:
  - addresses:
      - ip: 100.64.0.10 # ← REPLACE with the DO primary's tailnet IP (tailscale ip -4 on the droplet)
    ports:
      - name: postgres
        port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: placecontext-db-local
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: placecontext-db-local
subsets:
  - addresses:
      - ip: 100.64.0.20 # ← REPLACE with THIS local node's tailnet IP (tailscale ip -4)
    ports:
      - name: postgres
        port: 5432

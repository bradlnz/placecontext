# The installer creates the placecontext-local-ai ConfigMap from config.yaml or
# --shard-endpoints before applying this deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placecontext-cluster-host
  namespace: placecontext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placecontext-cluster-host
  template:
    metadata:
      labels:
        app: placecontext-cluster-host
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-host
          image: __PLACECONTEXT_RUNTIME_IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: CLUSTER
              value: "1"
            - name: PlaceContext__ClusterChat__ApiToken
              valueFrom:
                secretKeyRef:
                  name: placecontext-ai
                  key: api-token
          envFrom:
            - configMapRef:
                name: placecontext-local-ai
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/cluster/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/cluster/health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/cluster/health
              port: http
            periodSeconds: 30
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: placecontext-cluster-host
  namespace: placecontext
spec:
  selector:
    app: placecontext-cluster-host
  ports:
    - name: http
      port: 8081
      targetPort: http

# Replicated, self-healing PostgreSQL (pgvector) via CloudNativePG — 1 primary + 2 hot-standby
# replicas with streaming replication and automatic failover, spread across nodes by anti-affinity.
#
# NOTE: continuous backup / WAL archiving to an object store is intentionally NOT configured here —
# it accumulated WAL faster than it was pruned and filled the node disk. Database backups are the
# bounded nightly dumps in deploy/release/k3s/pg-backup.yaml (7-day retention). If you ever want PITR back,
# re-add a `backup:` + `barmanObjectStore` stanza (and a ScheduledBackup) pointed at real,
# capacity-managed S3 — never the in-cluster MinIO PVC.
#
# Apps connect to:
#   • placecontext-pg-rw  → the current primary (reads + writes)
#   • placecontext-pg-ro  → replicas only (read-only scale-out)
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: placecontext-pg
spec:
  instances: 3
  imageName: ghcr.io/bradlnz/placecontext-pg:16-pgvector
  imagePullPolicy: IfNotPresent
  primaryUpdateStrategy: unsupervised

  # Keep the existing app credentials working (postgres/postgres) by pinning the superuser secret.
  enableSuperuserAccess: true
  superuserSecret:
    name: placecontext-pg-superuser

  postgresql:
    parameters:
      max_connections: "200"

  bootstrap:
    initdb:
      database: placecontext
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  # Spread the 3 instances across different nodes for real HA.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  storage:
    size: 2Gi

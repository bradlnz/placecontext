apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: placecontext }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: portal-ingress, namespace: placecontext }
spec:
  podSelector: { matchLabels: { app: placecontext } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports: [{ protocol: TCP, port: 7700 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: database-ingress, namespace: placecontext }
spec:
  podSelector: { matchLabels: { app: placecontext-db } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: placecontext } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: cluster-host-ingress, namespace: placecontext }
spec:
  podSelector: { matchLabels: { app: placecontext-cluster-host } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: placecontext } }
      ports: [{ protocol: TCP, port: 8081 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: placecontext-jobs }
spec:
  podSelector: {}
  policyTypes: [Ingress]

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: placecontext-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: placecontext-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: placecontext
    namespace: placecontext
roleRef:
  kind: ClusterRole
  name: placecontext-node-reader
  apiGroup: rbac.authorization.k8s.io

# MinIO — S3-compatible object store for job run reports/artifacts and nightly DB dumps
# (deploy/release/k3s/pg-backup.yaml, 7-day retention). Single-node, PVC-backed: fine for dev/self-host.
# Credentials: placecontext-minio secret (generated by the release installer, never committed).
# (Continuous WAL archiving/PITR was removed after it grew unbounded and filled the node disk;
#  the retention-pruned dumps are the bounded replacement.)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  strategy: { type: Recreate }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-09-22T00-33-43Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - { name: MINIO_ROOT_USER,     valueFrom: { secretKeyRef: { name: placecontext-minio, key: ACCESS_KEY_ID } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: placecontext-minio, key: ACCESS_SECRET_KEY } } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { httpGet: { path: /minio/health/ready, port: 9000 }, initialDelaySeconds: 5, periodSeconds: 5 }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports: [{ name: api, port: 9000, targetPort: 9000 }, { name: console, port: 9001, targetPort: 9001 }]
---
# Create the backups bucket once MinIO is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-09-16T17-43-14Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set m http://minio:9000 "$AKID" "$ASK"; do echo waiting for minio; sleep 3; done
              mc mb --ignore-existing m/placecontext-reports
              echo "bucket ready"
          env:
            - { name: AKID, valueFrom: { secretKeyRef: { name: placecontext-minio, key: ACCESS_KEY_ID } } }
            - { name: ASK, valueFrom: { secretKeyRef: { name: placecontext-minio, key: ACCESS_SECRET_KEY } } }
